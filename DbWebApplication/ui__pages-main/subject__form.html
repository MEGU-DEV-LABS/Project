<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <script defer src="js/main.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container">
          <a href="#" class="logo">
            <img src="images/Logo__megu.png" alt="Logo" />
          </a>
        </div>
      </header>

      <main class="main">
        <div class="container">
          <h3 class="role">Створити предмет</h3>
          <form id="form__subject" action="/">
            <div class="input-control">
              <label>Назва предмету</label>
              <input
                id="name__subject"
                name="name"
                type="text"
                placeholder="Назва предмету"
              />
              <div class="error"></div>
            </div>

            <div class="input-control">
              <label>картинка предмету</label>
              <input
                id="images__subject"
                name="name"
                type="file"
                placeholder="Назва предмету"
              />
              <div class="error"></div>
            </div>

            <div class="btn__con">
              <button class="login" type="submit">Cтворити</button>
            </div>
          </form>
        </div>
      </main>

      <footer class="footer">
        <div class="container">
          <div class="footer__top">
            <img src="images/Logo__megu__footer.png" alt="" />
            <ul class="footer__list">
              <li class="footer__list__item">
                <a href="#" class="footer__link">
                  Основний сайт університету
                </a>
              </li>
              <li class="footer__list__item">
                <a href="#" class="footer__link"> Контакти </a>
              </li>
              <li class="footer__list__item">
                <a href="#" class="footer__link"> Платіжні реквізити МЕГУ </a>
              </li>
              <li class="footer__list__item">
                <a href="#" class="footer__link"> Електронні пошта </a>
              </li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
